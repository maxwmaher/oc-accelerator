name: Validate KFMB security dependencies

on:
  pull_request:
    branches: [kfmb-demo]
    paths:
      - apps/api/**
      - OC-Accelerator.Tests/**
      - infrastructure/**
      - .github/workflows/validate-kfmb-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Record SDK and baseline dependency paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          dotnet --info > validation/dotnet-info.txt
          baseline=$(git merge-base HEAD origin/kfmb-demo)
          printf '%s\n' "$baseline" > validation/base-revision.txt
          git worktree add "$RUNNER_TEMP/kfmb-baseline" "$baseline"
          for project in Accelerator.Core Accelerator.Mocks Accelerator.Functions; do
            path="$RUNNER_TEMP/kfmb-baseline/apps/api/$project/$project.csproj"
            dotnet restore "$path" --force --no-cache -p:NuGetAudit=true -p:NuGetAuditMode=all > "validation/baseline-$project-restore.log" 2>&1
            for package in System.Drawing.Common System.Security.Cryptography.Xml; do
              dotnet nuget why "$path" "$package" >> "validation/baseline-$project-paths.txt"
            done
            cat "validation/baseline-$project-paths.txt"
          done
          dotnet list "$RUNNER_TEMP/kfmb-baseline/apps/api/Accelerator.Api.sln" package --include-transitive --vulnerable --format json > validation/baseline-vulnerabilities.json
          dotnet list "$RUNNER_TEMP/kfmb-baseline/apps/api/Accelerator.Api.sln" package --include-transitive --format json > validation/baseline-resolved-packages.json

      - name: Clean restore with transitive vulnerability auditing
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore apps/api/Accelerator.Api.sln --force --no-cache -p:NuGetAudit=true -p:NuGetAuditMode=all 2>&1 | tee validation/restore.log
          dotnet restore OC-Accelerator.Tests/OC-Accelerator.Tests.csproj --force --no-cache -p:NuGetAudit=true -p:NuGetAuditMode=all 2>&1 | tee validation/test-restore.log

      - name: Release build and existing KFMB checkout and quantity tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build apps/api/Accelerator.Api.sln -c Release --no-restore 2>&1 | tee validation/build.log
          dotnet test OC-Accelerator.Tests/OC-Accelerator.Tests.csproj -c Release --no-restore --logger trx --results-directory "$GITHUB_WORKSPACE/validation/test-results" 2>&1 | tee validation/tests.log

      - name: Audit and record resolved packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list apps/api/Accelerator.Api.sln package --include-transitive --vulnerable --format json > validation/vulnerabilities.json
          dotnet list apps/api/Accelerator.Api.sln package --include-transitive --format json > validation/resolved-packages.json
          for project in Accelerator.Core Accelerator.Mocks Accelerator.Functions; do
            for package in System.Drawing.Common System.Security.Cryptography.Xml; do
              dotnet nuget why "apps/api/$project/$project.csproj" "$package" >> "validation/fixed-$project-paths.txt"
            done
            cat "validation/fixed-$project-paths.txt"
          done
          python3 - <<'PY' | tee validation/audit-comparison.txt
          import json
          from pathlib import Path
          def findings(path):
              data = json.loads(Path(path).read_text())
              return {(p["id"], p["resolvedVersion"], v["advisoryurl"])
                      for project in data["projects"]
                      for framework in project.get("frameworks", [])
                      for key in ("topLevelPackages", "transitivePackages")
                      for p in framework.get(key, [])
                      for v in p.get("vulnerabilities", [])}
          baseline = findings("validation/baseline-vulnerabilities.json")
          current = findings("validation/vulnerabilities.json")
          print("Pre-existing findings remaining:", sorted(baseline & current))
          print("Removed findings:", sorted(baseline - current))
          print("New findings:", sorted(current - baseline))
          assert not current - baseline, "Dependency changes introduced known vulnerabilities"
          PY

      - name: Publish using the repository's portable Release configuration
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish apps/api/Accelerator.Functions/Accelerator.Functions.csproj -c Release --no-restore --self-contained false -p:UseAppHost=false -o "$RUNNER_TEMP/kfmb-publish" 2>&1 | tee validation/publish.log

      - name: Verify generated manifests and packaged files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee validation/artifact-verification.txt
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path

          publish = Path(os.environ["RUNNER_TEMP"]) / "kfmb-publish"
          roots = [publish, Path("apps/api/Accelerator.Core/bin/Release"), Path("apps/api/Accelerator.Mocks/bin/Release")]
          manifests = sorted({p for root in roots for p in root.rglob("*.deps.json")})
          assert manifests, "No generated dependency manifests found"
          for name in ("Accelerator.Core", "Accelerator.Mocks"):
              expected = Path(f"apps/api/{name}/bin/Release/net8.0/{name}.deps.json")
              assert expected in manifests, f"Missing standalone manifest: {expected}"
          assert publish / "Accelerator.Functions.deps.json" in manifests, "Missing Functions manifest"
          xml_found = False
          for manifest in manifests:
              data = json.loads(manifest.read_text(encoding="utf-8-sig"))
              packages = set(data.get("libraries", {}))
              for target in data.get("targets", {}).values():
                  packages.update(target)
              selected = sorted(p for p in packages if p.startswith(("System.Drawing.Common/", "System.Security.Cryptography.Xml/")))
              for package in selected:
                  name, version = package.split("/", 1)
                  v = tuple(int(x) for x in version.split("."))
                  if name == "System.Drawing.Common":
                      assert not ((4, 0, 0) <= v < (4, 7, 2) or (5, 0, 0) <= v < (5, 0, 3)), package
                  else:
                      assert version == "8.0.5", package
                      xml_found = True
              if manifest.name in ("Accelerator.Core.deps.json", "Accelerator.Mocks.deps.json", "Accelerator.Functions.deps.json"):
                  assert "System.Security.Cryptography.Xml/8.0.5" in selected, f"Patched XML absent: {manifest}"
              if manifest.name == "Accelerator.Mocks.deps.json":
                  assert not any(p.startswith("System.Drawing.Common/") for p in selected), "Legacy Mocks Drawing path remains"
              print(f"{manifest}: {selected}")
          assert xml_found, "Patched XML dependency absent"
          for name in ("host.json", "extensions.json", "worker.config.json", "Accelerator.Functions.dll"):
              assert (publish / name).is_file(), f"Missing {name}"
          assert (publish / ".azurefunctions").is_dir(), "Missing worker extensions"
          worker = json.loads((publish / "worker.config.json").read_text())["description"]
          assert worker["defaultExecutablePath"] == "dotnet", "Publish must run on the target OS using dotnet"
          assert worker["defaultWorkerPath"] == "Accelerator.Functions.dll", "Unexpected worker entry point"
          print("Portable worker:", worker["defaultExecutablePath"], worker["defaultWorkerPath"])
          assert (publish / "functions.metadata").is_file(), "Missing function metadata"
          functions = json.loads((publish / "functions.metadata").read_text())
          assert functions, "No functions discovered during build"
          print("Generated functions:", ", ".join(f["name"] for f in functions))
          assert not list(publish.rglob("local.settings*.json")), "Local settings must never be packaged"
          hashes = {}
          for path in sorted(publish.rglob("*")):
              if path.is_file():
                  hashes[str(path.relative_to(publish))] = hashlib.sha256(path.read_bytes()).hexdigest()
          evidence = {"revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "configuration": "Release", "targetFramework": "net8.0", "runtimeIdentifier": "portable", "files": hashes}
          Path("validation/artifact-manifest.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print("Passed: generated manifests exclude both reported CVE ranges; XML resolves to 8.0.5.")
          archive = Path("kfmb-functions.zip")
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as package:
              for path in sorted(publish.rglob("*")):
                  if path.is_file():
                      package.write(path, path.relative_to(publish).as_posix())
          with zipfile.ZipFile(archive) as package:
              names = set(package.namelist())
              assert "host.json" in names, "host.json must be at ZIP root"
              assert any(name.startswith(".azurefunctions/") for name in names), "Worker extensions missing from ZIP"
              for name, expected_hash in hashes.items():
                  assert hashlib.sha256(package.read(name)).hexdigest() == expected_hash, f"ZIP hash mismatch: {name}"
          PY
          sha256sum kfmb-functions.zip > validation/package.sha256

      - name: Retain validation evidence and deployment candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfmb-security-validation
          path: |
            validation/
            kfmb-functions.zip
          if-no-files-found: error
          retention-days: 14
